name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Deploy

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            # Đi tới thư mục home
            cd ~

            # Kiểm tra project đã tồn tại chưa
            if [ -d "tech-device-shop/.git" ]; then

              echo "Repository already exists."
              echo "Pull latest code from main..."

              cd ~/tech-device-shop

              git fetch origin
              git checkout main
              git pull origin main

            else

              echo "Repository does not exist."
              echo "Cloning repository..."

              git clone https://github.com/Nguyenvaan77/tech-devices-shop.git ~/tech-device-shop

              cd ~/tech-device-shop

            fi

            echo "Current commit:"
            git log -1 --oneline

            echo "Pull Docker images..."
            docker compose pull

            echo "Start Docker containers..."
            docker compose up -d

            echo "Running containers:"
            docker compose ps
