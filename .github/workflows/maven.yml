# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest
    environment: Deploy

    steps:
    - uses: actions/checkout@v4
    - name: Login Docker
      uses: docker/login-action@v3
      with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    # Tạo .env từ GitHub Environment
    - name: Create .env
      env:
        # Secrets
        MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        JWT_REFRESH_KEY: ${{ secrets.JWT_REFRESH_KEY }}
        JWT_RESET_PASSWORD_KEY: ${{ secrets.JWT_RESET_PASSWORD_KEY }}
        MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        VNPAY_SECRET_KEY: ${{ secrets.VNPAY_SECRET_KEY }}

        # Variables
        MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
        MYSQL_USERNAME: ${{ vars.MYSQL_USERNAME }}
        MYSQL_PORT: ${{ vars.MYSQL_PORT }}
        REDIS_HOST: ${{ vars.REDIS_HOST }}
        REDIS_PORT: ${{ vars.REDIS_PORT }}
        JWT_EXPIRY_DAY: ${{ vars.JWT_EXPIRY_DAY }}
        JWT_EXPIRY_HOUR: ${{ vars.JWT_EXPIRY_HOUR }}
        JWT_EXPIRY_MINUTE: ${{ vars.JWT_EXPIRY_MINUTE }}
        JWT_ISSUER: ${{ vars.JWT_ISSUER }}
        MINIO_ACCESS_KEY: ${{ vars.MINIO_ACCESS_KEY }}
        MINIO_BUCKET_IMAGES: ${{ vars.MINIO_BUCKET_IMAGES }}
        MINIO_BUCKET_VIDEO: ${{ vars.MINIO_BUCKET_VIDEO }}
        MINIO_URL: ${{ vars.MINIO_URL }}
        GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
        GOOGLE_SCOPE: ${{ vars.GOOGLE_SCOPE }}
        VNPAY_TMN_CODE: ${{ vars.VNPAY_TMN_CODE }}
        VNPAY_PAY_URL: ${{ vars.VNPAY_PAY_URL }}
        VNPAY_RETURN_URL: ${{ vars.VNPAY_RETURN_URL }}
        VNPAY_IPN_URL: ${{ vars.VNPAY_IPN_URL }}
        SENDGRID_API_KEY: ${{ vars.SENDGRID_API_KEY }}
        SENDGRID_SENDER_EMAIL: ${{ vars.SENDGRID_SENDER_EMAIL }}
        SENDGRID_SENDER_NAME: ${{ vars.SENDGRID_SENDER_NAME }}

      run: |
        cat > .env <<EOF
        MYSQL_PASSWORD=$MYSQL_PASSWORD
        MYSQL_DATABASE=$MYSQL_DATABASE
        MYSQL_USERNAME=$MYSQL_USERNAME
        MYSQL_PORT=$MYSQL_PORT

        REDIS_HOST=$REDIS_HOST
        REDIS_PORT=$REDIS_PORT
        REDIS_PASSWORD=$REDIS_PASSWORD

        JWT_SECRET_KEY=$JWT_SECRET_KEY
        JWT_REFRESH_KEY=$JWT_REFRESH_KEY
        JWT_RESET_PASSWORD_KEY=$JWT_RESET_PASSWORD_KEY
        JWT_EXPIRY_DAY=$JWT_EXPIRY_DAY
        JWT_EXPIRY_HOUR=$JWT_EXPIRY_HOUR
        JWT_EXPIRY_MINUTE=$JWT_EXPIRY_MINUTE
        JWT_ISSUER=$JWT_ISSUER

        MINIO_URL=$MINIO_URL
        MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY
        MINIO_SECRET_KEY=$MINIO_SECRET_KEY
        MINIO_BUCKET_IMAGES=$MINIO_BUCKET_IMAGES
        MINIO_BUCKET_VIDEO=$MINIO_BUCKET_VIDEO

        GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
        GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
        GOOGLE_REDIRECT_URI=$GOOGLE_REDIRECT_URI
        GOOGLE_SCOPE=$GOOGLE_SCOPE

        VNPAY_TMN_CODE=$VNPAY_TMN_CODE
        VNPAY_SECRET_KEY=$VNPAY_SECRET_KEY
        VNPAY_PAY_URL=$VNPAY_PAY_URL
        VNPAY_RETURN_URL=$VNPAY_RETURN_URL
        VNPAY_IPN_URL=$VNPAY_IPN_URL

        SENDGRID_API_KEY=$SENDGRID_API_KEY
        SENDGRID_SENDER_EMAIL=$SENDGRID_SENDER_EMAIL
        SENDGRID_SENDER_NAME=$SENDGRID_SENDER_NAME
        EOF
    - name: Build with Maven
      run: mvn clean package -DskipTests
    - name: Build Backend API 
      run: docker compose build app
    - name: Start Service
      run: docker compose up -d
    - name: Check Health Backend API
      run: |
        for i in {1..5}; do
          status=$(curl -s http://localhost:8080/actuator/health | jq -r '.status')
          echo "Attempt $i/5: $status"
    
          if [ "$status" = "UP" ]; then
            exit 0
          fi
    
          sleep 5
        done
        exit 1

    - name: Push Docker image
      run: docker compose push
    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
