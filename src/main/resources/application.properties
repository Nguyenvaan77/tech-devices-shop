server.port=8080

# =========================
# Database
# =========================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoint.health.show-details=always

# =========================
# JWT
# =========================
jwt.secret-key=${JWT_SECRET_KEY}
jwt.refresh-key=${JWT_REFRESH_KEY}
jwt.reset-password-key=${JWT_RESET_PASSWORD_KEY}
jwt.expiryDay=${JWT_EXPIRY_DAY}
jwt.expiryHour=${JWT_EXPIRY_HOUR}
jwt.expiryMinute=${JWT_EXPIRY_MINUTE}
jwt.issuer=${JWT_ISSUER}

# =========================
# Redis
# =========================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# =========================
# MinIO
# =========================
minio.url=${MINIO_URL}
minio.accessKey=${MINIO_ACCESS_KEY}
minio.secretKey=${MINIO_SECRET_KEY}
minio.bucket.images=${MINIO_BUCKET_IMAGES}
minio.bucket.videos=${MINIO_BUCKET_VIDEO}


# =========================
# Google OAuth2
# =========================
oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
oauth2.client.registration.google.scope=${GOOGLE_SCOPE}


# =========================
# VNPay
# =========================
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.secretKey=${VNPAY_SECRET_KEY}
vnpay.payUrl=${VNPAY_PAY_URL}
vnpay.returnUrl=${VNPAY_RETURN_URL}
vnpay.ipnUrl=${VNPAY_IPN_URL}


# =========================
# SendGrid
# =========================
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.sender-email=${SENDGRID_SENDER_EMAIL}
sendgrid.sender-name=${SENDGRID_SENDER_NAME}