apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-nginx-deployment
  labels:
    app: react-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-nginx
  template:
    metadata:
      labels:
        app: react-nginx
    spec:
      containers:
        - name: react-nginx
          image: nguyenvanan77/app-react-nginx
          ports:
            - containerPort: 80
